      <h1>網站安全政策</h1>
      <article style="line-height: 2;">
        <p>任何未經授權企圖試圖危害新北市板橋區國光國民小學網站安全、破壞系統完整性或進行惡意攻擊之行為，皆嚴格禁止並將依法究辦。</p>
        <h2 style="font-size: 1.25rem; margin-top: 15px; color: var(--primary-color);">安全防護措施：</h2>
        <ul style="margin-left: 20px;">
          <li>裝設入侵偵測系統，阻絕非法入侵與惡意流量。</li>
          <li>定期執行網站弱點掃描與修補作業。</li>
          <li>每日進行資料自動備份作業，確保學習資料安全無虞。</li>
        </ul>
