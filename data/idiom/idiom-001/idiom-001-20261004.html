      <h1>【成語故事】井底之蛙（井底跤蛤仔）</h1>
      <p style="color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 8px;">
        發布日期：2026-10-04 | 分類：民間故事 | 權責單位：國光國小本土語組

      <article style="line-height: 2;">
        <h2 style="font-size: 1.35rem; color: var(--primary-color);">【漢羅對照與台羅拼音】</h2>
        <div style="background-color: var(--card-bg); padding: 16px; border-radius: 8px; border-left: 5px solid var(--primary-color); margin-bottom: 20px;">
          <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 4px;">井底跤蛤仔，看無天外天。</p>
          <p style="font-size: 1.1rem; color: var(--text-muted);">Tsing-té-kha kap-á, khàn-bô thinn-uāi-thinn.</p>

        <h2 style="font-size: 1.3rem;">【故事解說】</h2>
        <p>生活在水井底部的青蛙，以為天空只有井口那麼大。台語俗語常說「井底跤蛤仔」，用來比喻一個人的眼光短淺、見識狹窄。</p>
